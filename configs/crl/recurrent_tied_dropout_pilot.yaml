exp_name: recurrent_tied_dropout_pilot
track: false
capture_vis: false
checkpoint: true

# Pilot settings (adjust up for paper-scale)
num_epochs: 20
total_env_steps: 1000000
num_envs: 128
num_eval_envs: 32
batch_size: 256
unroll_length: 8
min_replay_size: 1000
max_replay_size: 100000
num_sgd_batches_per_training_step: 200

# Tied recurrence with depth dropout on critic only
critic_network_width: 256
actor_network_width: 256
critic_depth: 64
actor_depth: 64
encoder_type: recurrent_tied
recur_steps: 16
recur_depth_dropout: 0.25
recur_apply_to_actor: 0
recur_apply_to_critic: 1
recur_init_identity: 1
recur_trunc_bptt: 0
