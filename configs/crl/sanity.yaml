exp_name: sanity
track: false
capture_vis: false
checkpoint: false

# Small smoke-test settings
num_epochs: 1
total_env_steps: 2000
num_envs: 8
num_eval_envs: 4
batch_size: 64
unroll_length: 4
min_replay_size: 100
max_replay_size: 1000
num_sgd_batches_per_training_step: 2

# Network defaults
critic_network_width: 256
actor_network_width: 256
critic_depth: 4
actor_depth: 4
encoder_type: untied_resnet
recur_apply_to_actor: 0
recur_apply_to_critic: 0
