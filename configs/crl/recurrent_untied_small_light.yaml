exp_name: recurrent_untied_small_light
track: false
capture_vis: false
checkpoint: false

# Small/light pilot settings
num_epochs: 1
total_env_steps: 2000
num_envs: 4
num_eval_envs: 2
batch_size: 32
unroll_length: 4
min_replay_size: 100
max_replay_size: 2000
num_sgd_batches_per_training_step: 1

# Untied recurrence on critic only
critic_network_width: 256
actor_network_width: 256
critic_depth: 16
actor_depth: 16
encoder_type: recurrent_untied
recur_steps: 4
recur_depth_dropout: 0.0
recur_apply_to_actor: 0
recur_apply_to_critic: 1
recur_init_identity: 1
recur_trunc_bptt: 0
